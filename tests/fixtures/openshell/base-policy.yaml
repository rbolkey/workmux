# Candidate workmux base policy: the default policy plus the pseudo-terminal
# devices (for the session holder) and the baked devshell's /nix, read-only.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log, /nix]
  read_write: [/tmp, /dev/null, /dev/pts, /dev/ptmx]
landlock:
  compatibility: best_effort
