# Default policy plus the pseudo-terminal devices, without which no process in
# the sandbox can allocate a PTY (dtach: "init_pty: Permission denied").
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null, /dev/pts, /dev/ptmx]
landlock:
  compatibility: best_effort
